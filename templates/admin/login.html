<!DOCTYPE html>
<html lang="pt-PT">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Iniciar sessão | Emprego Angola</title>
  <link rel="icon" href="/static/img/favicon.png">
  <link rel="stylesheet" href="/static/vendor/bootstrap-icons/bootstrap-icons.css">
  <link rel="stylesheet" href="/static/css/admin.css">
</head>
<body class="admin-body">
  <main class="admin-content" style="max-width: 480px; margin: 10vh auto;">
    <section class="admin-panel admin-settings-section">
      <p class="admin-eyebrow">Área protegida</p>
      <h1>Iniciar sessão</h1>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <p role="alert">{{ message }}</p>
        {% endfor %}
      {% endwith %}
      <form method="post" class="admin-form-grid">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <input type="hidden" name="next" value="{{ next_url }}">
        <div class="admin-form-field field-span-full">
          <label for="email">Email</label>
          <input id="email" name="email" type="email" autocomplete="username" required>
        </div>
        <div class="admin-form-field field-span-full">
          <label for="password">Palavra-passe</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <div class="admin-form-actions field-span-full">
          <button class="admin-button admin-button-primary" type="submit">Entrar</button>
        </div>
      </form>
    </section>
  </main>
</body>
</html>
